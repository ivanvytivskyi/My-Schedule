<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f7fb; color: #111; }
    header { padding: 16px 20px; background: #667eea; color: white; }
    header h1 { margin: 0 0 6px; font-size: 20px; }
    header p { margin: 0; opacity: 0.9; font-size: 13px; }
    .container { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; }
    .panel { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .panel h2 { margin: 0 0 10px; font-size: 16px; }
    .list { max-height: 360px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
    .list-item { padding: 8px 10px; border-bottom: 1px solid #eef2f7; cursor: pointer; }
    .list-item:last-child { border-bottom: none; }
    .list-item.active { background: #eef2ff; }
    .search { display: flex; gap: 8px; margin-bottom: 10px; }
    .search input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    .btn { padding: 8px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn.primary { background: #667eea; color: white; }
    .btn.secondary { background: #eef2ff; color: #3730a3; }
    .diagram { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { text-align: left; font-size: 12px; padding: 6px; border-bottom: 1px solid #eef2f7; }
    .muted { color: #6b7280; font-size: 12px; }
    .pill { display: inline-block; padding: 2px 6px; background: #f3f4f6; border-radius: 999px; font-size: 11px; }
  </style>
</head>

  <script>
    const dataTag = document.getElementById('app-map-data');
    const mapData = JSON.parse(dataTag.textContent);

    const functionList = document.getElementById('functionList');
    const functionDetails = document.getElementById('functionDetails');
    const storageList = document.getElementById('storageList');
    const pipelineTable = document.getElementById('pipelineTable');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    function renderFunctions(filter = '') {
      const term = filter.toLowerCase();
      functionList.innerHTML = '';
      mapData.functions
        .filter(fn => !term || fn.name.toLowerCase().includes(term))
        .forEach(fn => {
          const div = document.createElement('div');
          div.className = 'list-item';
          div.textContent = `${fn.name} (${fn.type})`;
          div.addEventListener('click', () => showFunction(fn));
          functionList.appendChild(div);
        });
    }

    function showFunction(fn) {
      const calledBy = (mapData.callGraph.find(e => e.to && e.to.includes(fn.name)) || {}).from;
      const calls = (mapData.callGraph.find(e => e.from === fn.name) || {}).to || [];
      functionDetails.innerHTML = `
        <div><strong>${fn.name}</strong> <span class="pill">${fn.type}</span></div>
        <div class="muted">${fn.file} — ${fn.approxLocation}</div>
        <div style="margin-top:8px;"><strong>Calls:</strong> ${calls.length ? calls.join(', ') : '—'}</div>
        <div><strong>Called by:</strong> ${calledBy || '—'}</div>
      `;
    }

    function renderStorage() {
      storageList.innerHTML = '';
      Object.entries(mapData.dataFlow.localStorage).forEach(([key, info]) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `<div><strong>${key}</strong></div><div class="muted">Readers: ${(info.readers || []).join(', ') || '—'}<br>Writers: ${(info.writers || []).join(', ') || '—'}</div>`;
        storageList.appendChild(div);
      });
    }

    function renderPipeline() {
      pipelineTable.innerHTML = `
        <tr><th>Stage</th><th>Name</th><th>Functions</th></tr>
      `;
      mapData.pipelineStages.forEach(stage => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${stage.stage}</td><td>${stage.name}</td><td>${stage.functions.join(', ')}</td>`;
        pipelineTable.appendChild(row);
      });
    }

    searchInput.addEventListener('input', () => renderFunctions(searchInput.value));
    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      renderFunctions('');
    });

    document.getElementById('downloadSvg').addEventListener('click', () => {
      const svg = document.getElementById('diagramSvg');
      const serializer = new XMLSerializer();
      const svgBlob = new Blob([serializer.serializeToString(svg)], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(svgBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'app-map-diagram.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('downloadJson').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(mapData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'app-map.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    renderFunctions();
    renderStorage();
    renderPipeline();
  </script>
